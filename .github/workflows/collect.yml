# Every hour: store the newest checks of proxysvpn.com/rabotaet-li.json in data/.
# The site checks at minute 11 and keeps the last 24 checks in the document, so
# a run GitHub delays or skips is filled in by the next one. Two slots an hour,
# because GitHub drops scheduled runs at busy times. A row already stored is
# skipped; a commit happens only when something new arrived.

name: collect

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tests
        run: python3 -I -m unittest discover -s tests

      - name: Collect
        run: python3 -I scripts/collect.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data latest.json README.md
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
